name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Runner 自带 Android SDK，只需指定 SDK 路径，不要再重复安装
      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # 确认 sdkmanager 可用
          which sdkmanager || ls "$ANDROID_SDK_ROOT/cmdline-tools"/*/bin/sdkmanager

      - name: Install NDK & CMake & Platform 36
        run: |
          set -e
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          fi
          echo "using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" 2>&1 | tail -20
          echo "--- installed ---"
          ls "$ANDROID_SDK_ROOT/ndk" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          cd out 2>/dev/null && for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/**/*.log
            app/build/**/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: out/*
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Aegis ${{ github.ref_name }}

            **181 项检测 / 10 大模块**

            - 原创检测 16 项（APatch / Zygisk Next / MTK / 时钟一致性等）
            - 开源融合 10 项（DetectFrida / AntiFaker / emulator-detector / Auditor）
            - Compose Material 3 UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
