name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/aegis.keystore

      - name: Build Debug & Release
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out && for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: out/*
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Aegis ${{ github.ref_name }}

            **181 项检测 / 10 大模块**

            - 原创检测 16 项（APatch / Zygisk Next / MTK / 时钟一致性等）
            - 开源融合 10 项（DetectFrida / AntiFaker / emulator-detector / Auditor）
            - Compose Material 3 UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
