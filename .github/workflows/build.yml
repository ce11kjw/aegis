name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    # 使用 38.76 上的自建 runner（8C/16G，秒级响应）
    runs-on: [self-hosted, linux, x64, aegis]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment info
        run: |
          echo "=== runner ==="; uname -a; nproc; free -m | head -2
          echo "=== java ==="; java -version 2>&1 | head -2
          echo "=== sdk ==="; ls ${ANDROID_SDK_ROOT:-/opt/android-sdk}
          echo "=== disk ==="; df -h / | tail -1

      - name: Build Debug
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
          GRADLE_USER_HOME: /opt/actions-runner/.gradle
        run: |
          echo "sdk.dir=/opt/android-sdk" > local.properties
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release
        if: success()
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
          GRADLE_USER_HOME: /opt/actions-runner/.gradle
        run: |
          echo "sdk.dir=/opt/android-sdk" > local.properties
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        if: always()
        run: |
          rm -rf out && mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          cd out 2>/dev/null && for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la out/ 2>/dev/null || ls -la

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: out/*
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Aegis ${{ github.ref_name }}

            **181 项检测 / 10 大模块**

            - 原创检测 16 项（APatch / Zygisk Next / MTK / 时钟一致性等）
            - 开源融合 10 项（DetectFrida / AntiFaker / emulator-detector / Auditor）
            - Compose Material 3 UI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
